<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bundesländer-Benennen</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="bundesländerBenennen.css">
    <meta name="color-scheme" content="light">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Bundesländer benennen</h1>
        </header>

        <main class="main-content">
            <section class="layout-columns">
                <div class="map-column">
                    <div class="map-container">
                        <object type="image/svg+xml" data="Karte_Deutschland.svg" id="karteObject" class="karte-svg"></object>
                    </div>
                </div>

                <aside class="info-column">
                    <div class="question-box">
                        <p id="frage"></p>
                    </div>

                    <div class="controls">
                        <button class="btn btn-primary" onclick="neueRunde()" id="spielStarten_button">Nächste Frage</button>
                        <button class="btn btn-secondary" id="btn_hilfeUmschalten">💡 Hilfe</button>
                        <button class="btn btn-secondary" id="btn_lösungAnzeigenUmschalten">👀 Lösung</button>
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
